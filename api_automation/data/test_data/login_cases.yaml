# 登录用例数据（/login）
# expect_code: 期望业务码；expect_msg: 期望提示包含的关键字（可选）
- title: "正确账号密码登录"
  username: admin
  password: admin123
  expect_code: 200
  expect_token: true

- title: "密码错误"
  username: admin
  password: "wrong_password_123"
  expect_code: 500
  expect_msg: "用户不存在/密码错误"

- title: "用户不存在"
  username: "no_such_user_001"
  password: admin123
  expect_code: 500
  expect_msg: "用户不存在/密码错误"

- title: "用户名为空"
  username: ""
  password: admin123
  expect_code: 500

- title: "密码为空"
  username: admin
  password: ""
  expect_code: 500

- title: "用户名超长（51 字符）"
  username: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  password: admin123
  expect_code: 500

- title: "SQL 注入式用户名"
  username: "admin' or '1'='1"
  password: admin123
  expect_code: 500
