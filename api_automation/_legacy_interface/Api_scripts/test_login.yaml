-
  title: "正确的账号密码登录"
  request:
    method: post
    url: /dev-api/login
    headers: null
    json:
      username: admin
      password: admin123
  validate:
    code: 200
    msg: "操作成功"

-
  title: "密码错误登录失败"
  request:
    method: post
    url: /dev-api/login
    headers: null
    json:
      username: admin
      password: wrongpassword
  validate:
    code: 500
    msg: "用户不存在/密码错误"

-
  title: "用户名为空登录"
  request:
    method: post
    url: /dev-api/login
    headers: null
    json:
      username: ""
      password: admin123
  validate:
    code: 500

-
  title: "密码为空登录"
  request:
    method: post
    url: /dev-api/login
    headers: null
    json:
      username: admin
      password: ""
  validate:
    code: 500

-
  title: "不存在的用户登录"
  request:
    method: post
    url: /dev-api/login
    headers: null
    json:
      username: nonexist_user
      password: admin123
  validate:
    code: 500
    msg: "用户不存在/密码错误"