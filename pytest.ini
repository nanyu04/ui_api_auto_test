[pytest]
# 若依项目 pytest 配置
testpaths = Api_scripts scripts
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# allure 报告输出目录
addopts =
    -v
    --alluredir=reports/allure-results
    --tb=short
    -p no:warnings

# 标记
markers =
    smoke: 冒烟测试用例
    login: 登录相关测试
    user: 用户管理测试
    role: 角色管理测试
    menu: 菜单管理测试
    dept: 部门管理测试
    dict: 字典管理测试
    config: 参数配置测试
    notice: 通知公告测试
    monitor: 监控管理测试
    log: 日志管理测试
    selenium: Selenium UI测试