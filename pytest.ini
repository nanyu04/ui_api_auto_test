[pytest]
; ---------- 日志配置 ----------
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %H:%M:%S

; ---------- 测试发现规则 ----------
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv .venv api_automation/_legacy_interface

; ---------- 用例路径 ----------
; api_automation/tests  = 接口自动化
; ui_automation/scripts = UI 自动化（Selenium）
testpaths = api_automation/tests ui_automation/scripts
; 接口包在 api_automation/，UI 的 page/base 在 ui_automation/，两者都要能被导入
pythonpath = . api_automation ui_automation

; ---------- 命令行默认参数 ----------
addopts =
    -v
    --alluredir=reports/allure-results
    --clean-alluredir
    --tb=short
    -p no:warnings

; ---------- 标记注册 ----------
markers =
    smoke: 冒烟测试（核心主流程，每次提交必跑）
    regression: 回归测试（全量功能验证）
    P0: P0 — 核心功能，必须通过
    P1: P1 — 重要功能
    P2: P2 — 次要功能 / 边界条件
    slow: 慢速测试（执行时间较长，不加入 CI 快速门禁）
    auth: 需要鉴权
    contract: 契约测试（接口结构校验）
    lifecycle: 生命周期场景测试
    login: 登录相关测试
    user: 用户管理测试
    role: 角色管理测试
    menu: 菜单管理测试
    dept: 部门管理测试
    post: 岗位管理测试
    dict: 字典管理测试
    config: 参数配置测试
    notice: 通知公告测试
    monitor: 监控管理测试
    selenium: Selenium UI 测试（需要浏览器与驱动）

; ---------- 告警过滤 ----------
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
