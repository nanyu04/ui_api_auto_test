-
  title: "查询角色列表"
  request:
    method: get
    url: /dev-api/system/role/list
    params:
      pageNum: 1
      pageSize: 10
  validate:
    code: 200

-
  title: "按角色名称搜索"
  request:
    method: get
    url: /dev-api/system/role/list
    params:
      pageNum: 1
      pageSize: 10
      roleName: 超级管理员
  validate:
    code: 200

-
  title: "按角色状态搜索"
  request:
    method: get
    url: /dev-api/system/role/list
    params:
      pageNum: 1
      pageSize: 10
      status: "0"
  validate:
    code: 200